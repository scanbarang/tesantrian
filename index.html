<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian & Absensi Promotor - UFO Kebonsari</title>
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #2563eb;
            --customer-blue: #2563eb;
            --closing-red: #dc2626;
            --purple-cs: #7c3aed;
            --teal-cs: #0d9488;
            --amber-rest: #d97706;
            --checkin-green: #059669;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
            
            --ha-bg: #eab308;        
            --ha-border: #ca8a04;
            --av-bg: #10b981;        
            --av-border: #059669;
        }

        body.dark-mode {
            --bg-color: #000000 !important;
            --card-bg: #050507 !important;
            --text-main: #ffffff !important;
            --text-muted: #a1a1aa !important;
            --border: #27272a !important;
            --ha-bg: #09090b !important;
            --ha-border: #facc15 !important;
            --av-bg: #09090b !important;
            --av-border: #22c55e !important;
        }

        body.dark-mode { background: #000000 !important; }
        body.dark-mode .app-container {
            background: #050507 !important;
            border: 2px solid #3f3f46 !important;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.08), inset 0 0 15px rgba(255, 255, 255, 0.02) !important;
        }
        body.dark-mode .gradient-header {
            background: #09090b !important;
            border: 2px solid #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6), inset 0 0 10px rgba(239, 68, 68, 0.3) !important;
        }
        body.dark-mode .gradient-header h2 { color: #f87171 !important; text-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
        body.dark-mode .gradient-header p { color: #ffffff !important; }

        body.dark-mode select, body.dark-mode input[type="text"] {
            background: #09090b !important; color: #ffffff !important; border-color: #3f3f46 !important;
        }
        body.dark-mode select:disabled { background-color: #18181b !important; color: #71717a !important; }
        body.dark-mode .user-badge { background: #09090b !important; border-color: #3f3f46 !important; color: #ffffff !important; }
        body.dark-mode .list-antrian li { background: #09090b !important; border-color: #3f3f46 !important; color: #ffffff !important; }
        body.dark-mode .modal-box { background: #09090b !important; border: 2px solid #52525b !important; color: #ffffff !important; }
        body.dark-mode .modal-desc { color: #d4d4d8 !important; }
        body.dark-mode .btn-cancel { background: #18181b !important; color: #ffffff !important; border: 1px solid #52525b; }
        body.dark-mode .dark-mode-btn { background: #09090b !important; color: #ffffff !important; border-color: #52525b !important; }
        body.dark-mode #keterangan-lock-box { background: #18181b !important; border-color: #7f1d1d !important; color: #fca5a5 !important; }

        *, body, button, select, input { font-family: 'Plus Jakarta Sans', sans-serif !important; box-sizing: border-box; }
        body { background: var(--bg-color); color: var(--text-main); margin: 0; padding: 16px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.3s ease, color 0.3s ease; }
        .app-container { width: 100%; max-width: 500px; background: var(--card-bg); border-radius: 24px; padding: 24px; border: 2px solid var(--border); box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1); text-align: center; }

        .top-controls { display: flex; justify-content: flex-end; margin-bottom: 12px; }
        .dark-mode-btn { background: #ffffff; border: 2px solid var(--border); color: var(--text-main); padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

        .gradient-header { background: linear-gradient(135deg, #dc2626 0%, #ffffff 100%); border-radius: 18px; padding: 22px; color: white; margin-bottom: 18px; box-shadow: 0 8px 20px -4px rgba(220, 38, 38, 0.3); }
        .gradient-header h2 { margin: 0; font-size: 22px; font-weight: 800; text-shadow: 1px 1px 4px rgba(0,0,0,0.6); }
        .gradient-header p { margin: 6px 0 0 0; opacity: 0.95; font-size: 13px; font-weight: 700; text-shadow: 1px 1px 4px rgba(0,0,0,0.6); }

        .status-badge-sistem { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 800; text-transform: uppercase; margin-bottom: 18px; letter-spacing: 0.5px; }
        .status-open { background: #dcfce7; color: #15803d; border: 2px solid #86efac; }
        .status-closed { background: #fee2e2; color: #b91c1c; border: 2px solid #fca5a5; }

        .card-giliran-wrapper { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .card-giliran-ha { background: var(--ha-bg); border: 2px solid var(--ha-border); border-radius: 16px; padding: 16px 12px; text-align: center; color: #ffffff; box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25); }
        .card-giliran-ha .label-giliran { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #fefce8; }
        .card-giliran-ha .nama-giliran-aktif { font-size: 20px; font-weight: 800; color: #ffffff; margin: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .card-giliran-av { background: var(--av-bg); border: 2px solid var(--av-border); border-radius: 16px; padding: 16px 12px; text-align: center; color: #ffffff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25); }
        .card-giliran-av .label-giliran { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #ecfdf5; }
        .card-giliran-av .nama-giliran-aktif { font-size: 20px; font-weight: 800; color: #ffffff; margin: 6px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .timer-mundur { font-size: 18px; font-weight: 800; margin-top: 4px; display: block; font-variant-numeric: tabular-nums; color: #ffffff !important; }
        .timer-warning-merah { color: #fef08a !important; animation: blinkAlert 1s infinite; }
        @keyframes blinkAlert { 50% { opacity: 0.3; } }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }

        select, input[type="text"] { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--border); background: #ffffff; font-size: 15px; font-weight: 600; color: var(--text-main); outline: none; }
        select:focus, input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        button { width: 100%; padding: 14px 12px; border-radius: 14px; font-size: 13px; font-weight: 800; cursor: pointer; border: none; text-transform: uppercase; transition: all 0.2s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; letter-spacing: 0.3px; line-height: 1.3; text-align: center; word-break: break-word; }
        button:active { transform: scale(0.98); }

        .btn-success { background: var(--customer-blue); color: white; }
        .btn-customer { background: var(--customer-blue); color: white; }
        .btn-closing { background: var(--closing-red); color: white; }
        .btn-purple { background: var(--purple-cs); color: white; }
        .btn-teal { background: var(--teal-cs); color: white; }
        .btn-amber { background: var(--amber-rest); color: white; }
        .btn-checkin { background: var(--checkin-green); color: white; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3); }
        
        .btn-cancel { background: #e2e8f0; color: var(--text-main); }
        .btn-disabled { background: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed !important; box-shadow: none !important; }
        body.dark-mode .btn-disabled { background: #18181b !important; color: #52525b !important; border: 1px solid #27272a; }

        .spinner { width: 16px; height: 16px; border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #ffffff; animation: spin 0.8s linear infinite; display: inline-block; flex-shrink: 0; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .user-badge { background: #f8fafc; border: 2px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 18px; text-align: left; font-size: 14px; font-weight: 600; }
        .list-antrian { list-style: none; padding: 0; margin: 8px 0 0 0; text-align: left; }
        .list-antrian li { padding: 12px 14px; background: #ffffff; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 2px solid var(--border); font-size: 14px; font-weight: 700; }
        
        .badge-status-item { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
        .badge-standby { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
        .badge-melayani { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .badge-cs { background: #f3e8ff; color: #6b21a8; border: 1px solid #d8b4fe; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 11, 20, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 380px; padding: 24px; border-radius: 20px; text-align: center; border: 2px solid var(--border); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-controls">
            <button type="button" class="dark-mode-btn" id="btn-toggle-dark" onclick="toggleDarkMode()">🌙 Gelap</button>
        </div>

        <div class="gradient-header">
            <h2>Antrian & Absensi Promotor</h2>
            <p>UFO Kebonsari</p>
        </div>

        <div id="badge-status-sistem" class="status-badge-sistem status-open">
            STATUS ANTRIAN: OPEN
        </div>

        <div class="card-giliran-wrapper">
            <div class="card-giliran-ha">
                <div class="label-giliran">Giliran HA Saat Ini</div>
                <div id="nama-aktif-ha" class="nama-giliran-aktif">-</div>
                <span id="timer-mundur-ha" class="timer-mundur">00:00</span>
            </div>
            <div class="card-giliran-av">
                <div class="label-giliran">Giliran AV Saat Ini</div>
                <div id="nama-aktif-av" class="nama-giliran-aktif">-</div>
                <span id="timer-mundur-av" class="timer-mundur">00:00</span>
            </div>
        </div>

        <!-- PANEL LOGIN / KUNCI HP -->
        <div id="panel-login" style="display: none;">
            <div class="input-group">
                <label>Pilih Nama Anda (Kunci Perangkat)</label>
                <select id="pilih-sales"><option value="">-- Pilih Nama Anda --</option></select>
            </div>
            <button type="button" class="btn-customer" onclick="simpanAkunHP()">Simpan & Kunci di HP Ini</button>
        </div>

        <!-- PANEL MENU UTAMA PROMOTOR -->
        <div id="panel-menu-utama" style="display: none;">
            <div class="user-badge">
                <span style="color: var(--text-muted);">Promotor:</span> <strong id="label-user-aktif" style="color:var(--primary-dark); font-size: 15px;">-</strong>
            </div>

            <!-- TOMBOL CHECKIN ABSEN KEDATANGAN DENGAN IKON MODERN & TANPA TIMER -->
            <button type="button" id="btn-checkin" class="btn-checkin" onclick="kirimAbsenCheckin()">
                📍 CHECKIN KEDATANGAN
            </button>
            <div id="status-checkin-teks" style="font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 16px;">Status: Belum Checkin Hari Ini</div>

            <div class="input-group">
                <label>Pilih Kategori Antrian</label>
                <select id="pilih-kategori">
                    <option value="HA">HA (Home Appliance)</option>
                    <option value="AV">AV (Audio Video)</option>
                </select>
            </div>

            <button type="button" id="btn-utama-antri" class="btn-success btn-disabled" disabled>Antrian Diatur Manual oleh SPV</button>
            
            <div id="keterangan-lock-box" style="display: none; margin-top: 10px; padding: 12px 14px; background: #fee2e2; border: 2px solid #fca5a5; color: #b91c1c; border-radius: 12px; font-size: 12px; font-weight: 700; text-align: left;">
                🔒 <b>Akun Di-lock oleh SPV</b><br>
                <span id="teks-alasan-lock" style="font-weight: 600; font-size: 11px; opacity: 0.95; display: block; margin-top: 4px;">-</span>
            </div>

            <button type="button" id="btn-utama-customer" class="btn-customer" onclick="aksiUtamaCustomer()" style="display: none; margin-top: 12px;">Sudah Membawa Customer</button>
            <button type="button" id="btn-selesai-closing" class="btn-closing" onclick="aksiSelesaiClosing()" style="display: none; margin-top: 10px;">SELESAI MELAYANI (DEAL / CLOSING)</button>
            <button type="button" id="btn-utama-cs" class="btn-purple" onclick="aksiToggleCS()" style="display: none; margin-top: 12px;">DIPANGGIL CS/GUDANG (KUNCI POSISI)</button>
            <button type="button" id="btn-keluar-istirahat" class="btn-amber" onclick="bukaModalKeluarIstirahat()" style="display: none; margin-top: 12px;">KELUAR ANTRIAN (ISTIRAHAT)</button>
        </div>

        <div style="margin-top: 24px; text-align: left;">
            <div style="margin-bottom: 20px;">
                <span style="font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Live Urutan HA</span>
                <ul id="item-antrian-list-ha" class="list-antrian"><li><span>Memuat data...</span></li></ul>
            </div>
            <div>
                <span style="font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Live Urutan AV</span>
                <ul id="item-antrian-list-av" class="list-antrian"><li><span>Memuat data...</span></li></ul>
            </div>

    <!-- MODAL -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">-</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-customer" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRAVavq87AMEX40cM3-3SsIMP89CeW6kJT_MSpxxILasQ4gohb_sMKtG50zt8kpyye/exec";

        // ==========================================================
        // KOORDINAT TITIK TOKO UFO KEBONSARI (SILAHKAN SESUAIKAN)
        // ==========================================================
        const LAT_TOKO = -7.9666;   
        const LNG_TOKO = 112.6326;  
        const MAKS_JARAK_METER = 150; 

        let waktuStandbyHAGlobal = null;
        let waktuStandbyAVGlobal = null;
        let daftarAntrianGlobal = [];
        let masterSalesGlobal = [];
        let statusSayaGlobal = "belum_ada"; 
        let statusSistemGlobal = "BUKA";
        let namaSalesAktifGlobal = "";
        const BATAS_MENIT = 60;
        let sedangProsesAksi = false;

        window.onload = function() {
            initDarkMode();
            muatMasterSalesInstant();
            muatCacheAntrianInstan();
            
            const cachedNama = localStorage.getItem('ufo_nama_sales_aktif');
            if (cachedNama) {
                namaSalesAktifGlobal = cachedNama;
                document.getElementById('panel-login').style.display = 'none';
                document.getElementById('panel-menu-utama').style.display = 'block';
                document.getElementById('label-user-aktif').innerText = cachedNama;
                cekStatusCheckinLokal(cachedNama);
            } else {
                document.getElementById('panel-login').style.display = 'block';
                document.getElementById('panel-menu-utama').style.display = 'none';
            }

            cekServerBg();
            muatMasterSales();
            setInterval(muatDataAntrian, 1000); 
            setInterval(hitungMundurLokal, 1000); 
        };

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('ufo_dark_mode', isDark ? 'true' : 'false');
            updateDarkButtonText(isDark);
        }

        function initDarkMode() {
            const savedDark = localStorage.getItem('ufo_dark_mode');
            if (savedDark === 'true') {
                document.body.classList.add('dark-mode');
                updateDarkButtonText(true);
            }
        }

        function updateDarkButtonText(isDark) {
            const btn = document.getElementById('btn-toggle-dark');
            if (btn) btn.innerHTML = isDark ? '☀️ Terang' : '🌙 Gelap';
        }

        function getDeviceId() {
            let localSalt = localStorage.getItem('ufo_device_salt');
            if (!localSalt) {
                localSalt = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : Math.random().toString(36).substring(2) + Date.now().toString(36);
                localStorage.setItem('ufo_device_salt', localSalt);
            }
            let hash = 0;
            for (let i = 0; i < localSalt.length; i++) { hash = (hash << 5) - hash + localSalt.charCodeAt(i); hash |= 0; }
            return "DEV-" + Math.abs(hash).toString().padStart(9, '0').substring(0, 9);
        }

        function muatCacheAntrianInstan() {
            const cachedAntrian = localStorage.getItem('ufo_antrian_cache');
            if (cachedAntrian) {
                try {
                    const parsed = JSON.parse(cachedAntrian);
                    renderUIRental(parsed.data, parsed.statusAntrian, parsed.waktuStandbyHA, parsed.waktuStandbyAV, parsed.pengumumanSPV);
                } catch(e) {}
            }
        }

        function cekServerBg() {
            const deviceId = getDeviceId();
            Promise.all([
                fetch(`${SCRIPT_URL}?aksi=cekBinding&deviceId=${encodeURIComponent(deviceId)}`).then(r => r.json()).catch(() => null),
                fetch(`${SCRIPT_URL}?aksi=getAntrian`).then(r => r.json()).catch(() => null)
            ]).then(([resBinding, resAntrian]) => {
                if (resBinding) {
                    if (resBinding.status === "terkunci" && resBinding.nama) {
                        namaSalesAktifGlobal = resBinding.nama;
                        localStorage.setItem('ufo_nama_sales_aktif', resBinding.nama);
                        document.getElementById('panel-login').style.display = 'none';
                        document.getElementById('panel-menu-utama').style.display = 'block';
                        document.getElementById('label-user-aktif').innerText = resBinding.nama;
                        cekStatusCheckinLokal(resBinding.nama);
                    } else if (resBinding.status === "bebas") {
                        localStorage.removeItem('ufo_nama_sales_aktif');
                        document.getElementById('panel-login').style.display = 'block';
                        document.getElementById('panel-menu-utama').style.display = 'none';
                    }
                }
                if (resAntrian && resAntrian.status === "sukses") {
                    localStorage.setItem('ufo_antrian_cache', JSON.stringify(resAntrian));
                    renderUIRental(resAntrian.data, resAntrian.statusAntrian, resAntrian.waktuStandbyHA, resAntrian.waktuStandbyAV, resAntrian.pengumumanSPV);
                }
            });
        }

        function simpanAkunHP() {
            const namaPilih = document.getElementById('pilih-sales').value;
            const deviceId = getDeviceId();
            if(!namaPilih) return tampilkanModal("Perhatian", "Silakan pilih nama Anda!");
            
            fetch(`${SCRIPT_URL}?aksi=kunciPerangkat&namaSales=${encodeURIComponent(namaPilih)}&deviceId=${encodeURIComponent(deviceId)}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses") {
                    namaSalesAktifGlobal = namaPilih;
                    localStorage.setItem('ufo_nama_sales_aktif', namaPilih);
                    document.getElementById('panel-login').style.display = 'none';
                    document.getElementById('panel-menu-utama').style.display = 'block';
                    document.getElementById('label-user-aktif').innerText = namaPilih;
                    cekStatusCheckinLokal(namaPilih);
                    tampilkanModal("Berhasil", `HP terikat untuk: ${namaPilih}`);
                    muatDataAntrian(true);
                } else { tampilkanModal("Akses Ditolak", res.pesan); }
            });
        }

        function getAkunAktif() {
            if (!namaSalesAktifGlobal) namaSalesAktifGlobal = localStorage.getItem('ufo_nama_sales_aktif') || "";
            return namaSalesAktifGlobal;
        }

        function hitungJarakMeter(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function kirimAbsenCheckin() {
            const namaSales = getAkunAktif().trim();
            const btnCheckin = document.getElementById('btn-checkin');
            const statusTeks = document.getElementById('status-checkin-teks');

            if (!namaSales) return tampilkanModal("Perhatian", "Akun belum terikat.");

            if (!navigator.geolocation) {
                return tampilkanModal("Error", "GPS tidak didukung di perangkat ini.");
            }

            btnCheckin.disabled = true;
            btnCheckin.innerHTML = `<span class="spinner"></span> Memeriksa Radius Toko...`;
            statusTeks.innerHTML = "🛰️ Mengunci koordinat GPS Maps Anda...";

            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const latUser = position.coords.latitude;
                    const lngUser = position.coords.longitude;

                    const jarakMeter = hitungJarakMeter(latUser, lngUser, LAT_TOKO, LNG_TOKO);

                    if (jarakMeter > MAKS_JARAK_METER) {
                        btnCheckin.disabled = false;
                        btnCheckin.innerText = "📍 CHECKIN KEDATANGAN";
                        statusTeks.innerHTML = `<span style="color: #dc2626;">❌ Di luar area toko! (Jarak ±${Math.round(jarakMeter)}m). Maksimal ${MAKS_JARAK_METER}m.</span>`;
                        tampilkanModal("Akses Ditolak", `Anda berada di luar area toko (±${Math.round(jarakMeter)} meter dari titik toko). Mendekatlah ke area toko.`);
                        return;
                    }

                    statusTeks.innerHTML = "🛰️ Radius valid! Mengirim data ke server...";
                    const tglHariIni = new Date().toISOString().split('T')[0];

                    fetch(`${SCRIPT_URL}?aksi=absenCheckin&namaSales=${encodeURIComponent(namaSales)}&lat=${latUser}&lng=${lngUser}&t=${Date.now()}`)
                    .then(res => res.json())
                    .then(res => {
                        const jamSekarang = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        localStorage.setItem(`checkin_${namaSales}_${tglHariIni}`, jamSekarang);
                        
                        btnCheckin.disabled = true;
                        btnCheckin.className = "btn-checkin btn-disabled";
                        // IKON CENTANG MODERN SVG
                        btnCheckin.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:4px;"><polyline points="20 6 9 17 4 12"></polyline></svg> SUDAH CHECKIN (${jamSekarang})`;
                        statusTeks.innerHTML = `<span style="color: #059669;">🟢 Berhasil Checkin pada ${jamSekarang} WIB (Aman di dalam area toko)</span>`;
                        tampilkanModal("Checkin Berhasil", "Kehadiran dan titik lokasi toko Anda telah tercatat dengan aman.");
                    })
                    .catch(() => {
                        btnCheckin.disabled = false;
                        btnCheckin.innerText = "📍 CHECKIN KEDATANGAN";
                        statusTeks.innerHTML = `<span style="color: #dc2626;">❌ Gagal terhubung ke server. Coba lagi.</span>`;
                    });
                },
                function(error) {
                    btnCheckin.disabled = false;
                    btnCheckin.innerText = "📍 CHECKIN KEDATANGAN";
                    statusTeks.innerHTML = `<span style="color: #dc2626;">❌ Izin GPS ditolak oleh browser HP.</span>`;
                    tampilkanModal("GPS Ditolak", "Pastikan izin lokasi di HP Anda diaktifkan.");
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function cekStatusCheckinLokal(nama) {
            const tglHariIni = new Date().toISOString().split('T')[0];
            const jamCheckin = localStorage.getItem(`checkin_${nama}_${tglHariIni}`);
            const btnCheckin = document.getElementById('btn-checkin');
            const statusTeks = document.getElementById('status-checkin-teks');

            if (jamCheckin && btnCheckin && statusTeks) {
                btnCheckin.disabled = true;
                btnCheckin.className = "btn-checkin btn-disabled";
                // IKON CENTANG MODERN SVG
                btnCheckin.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle; margin-right:4px;"><polyline points="20 6 9 17 4 12"></polyline></svg> SUDAH CHECKIN (${jamCheckin})`;
                statusTeks.innerHTML = `<span style="color: #059669;">🟢 Sudah Checkin hari ini pukul ${jamCheckin} WIB</span>`;
            }
        }

        function hitungMundurLokal() {
            const labelTimerHA = document.getElementById('timer-mundur-ha');
            const labelTimerAV = document.getElementById('timer-mundur-av');
            const now = new Date().getTime();

            let standbyHAObj = daftarAntrianGlobal.find(item => item.status === "Standby" && (item.kategori || "HA") === "HA");
            if (waktuStandbyHAGlobal && standbyHAObj) {
                let sisaMs = (BATAS_MENIT * 60 * 1000) - (now - new Date(waktuStandbyHAGlobal).getTime());
                if (sisaMs > 0) {
                    let m = Math.floor(sisaMs / 60000), s = Math.floor((sisaMs % 60000) / 1000);
                    labelTimerHA.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    labelTimerHA.classList.toggle('timer-warning-merah', sisaMs <= 60000);
                } else { labelTimerHA.innerText = "Habis!"; labelTimerHA.classList.add('timer-warning-merah'); }
            } else { labelTimerHA.innerText = "00:00"; labelTimerHA.classList.remove('timer-warning-merah'); }

            let standbyAVObj = daftarAntrianGlobal.find(item => item.status === "Standby" && item.kategori === "AV");
            if (waktuStandbyAVGlobal && standbyAVObj) {
                let sisaMs = (BATAS_MENIT * 60 * 1000) - (now - new Date(waktuStandbyAVGlobal).getTime());
                if (sisaMs > 0) {
                    let m = Math.floor(sisaMs / 60000), s = Math.floor((sisaMs % 60000) / 1000);
                    labelTimerAV.innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                    labelTimerAV.classList.toggle('timer-warning-merah', sisaMs <= 60000);
                } else { labelTimerAV.innerText = "Habis!"; labelTimerAV.classList.add('timer-warning-merah'); }
            } else { labelTimerAV.innerText = "00:00"; labelTimerAV.classList.remove('timer-warning-merah'); }
        }

        function muatMasterSalesInstant() {
            const cached = localStorage.getItem('ufo_master_sales_cache');
            if (cached) { masterSalesGlobal = JSON.parse(cached); updateDaftarSales(masterSalesGlobal); }
        }

        function muatMasterSales() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales&t=${Date.now()}`)
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    masterSalesGlobal = res.data;
                    localStorage.setItem('ufo_master_sales_cache', JSON.stringify(res.data));
                    updateDaftarSales(res.data);
                }
            }).catch(() => {});
        }

        function updateDaftarSales(dataSales) {
            let html = '<option value="">-- Pilih Nama Anda --</option>';
            dataSales.forEach(item => { html += `<option value="${item.nama}">${item.nama}</option>`; });
            const selectEl = document.getElementById('pilih-sales');
            if (selectEl) selectEl.innerHTML = html;
        }

        function renderUIRental(dataAntrian, statusSistem, waktuStandbyHA, waktuStandbyAV, pengumumanSPV) {
            daftarAntrianGlobal = dataAntrian || [];
            statusSistemGlobal = statusSistem || "BUKA";
            waktuStandbyHAGlobal = waktuStandbyHA || null;
            waktuStandbyAVGlobal = waktuStandbyAV || null;
            const akunSaya = getAkunAktif().trim();

            const badge = document.getElementById('badge-status-sistem');
            badge.innerText = statusSistemGlobal === "BUKA" ? "STATUS ANTRIAN: OPEN" : "STATUS ANTRIAN: CLOSED";
            badge.className = statusSistemGlobal === "BUKA" ? "status-badge-sistem status-open" : "status-badge-sistem status-closed";

            let listHtmlHA = "", listHtmlAV = "", namaHANow = "-", namaAVNow = "-";
            statusSayaGlobal = "belum_ada"; 
            let apakahSayaUrutanPertamaHA = false, apakahSayaUrutanPertamaAV = false;

            let listStandby = daftarAntrianGlobal.filter(item => item.status === "Standby");
            let standbyHA = listStandby.find(item => (item.kategori || "HA") === "HA");
            let standbyAV = listStandby.find(item => item.kategori === "AV");

            if (standbyHA) { namaHANow = standbyHA.nama; if (akunSaya && standbyHA.nama.trim().toLowerCase() === akunSaya.toLowerCase()) apakahSayaUrutanPertamaHA = true; }
            if (standbyAV) { namaAVNow = standbyAV.nama; if (akunSaya && standbyAV.nama.trim().toLowerCase() === akunSaya.toLowerCase()) apakahSayaUrutanPertamaAV = true; }

            if(daftarAntrianGlobal.length > 0) {
                let urutHA = 1, urutAV = 1;
                daftarAntrianGlobal.forEach((item) => {
                    const namaItem = String(item.nama).trim();
                    const kategoriItem = item.kategori ? item.kategori : "HA"; 

                    if(akunSaya && namaItem.toLowerCase() === akunSaya.toLowerCase()) {
                        statusSayaGlobal = item.status; 
                        const selectKat = document.getElementById('pilih-kategori');
                        if (selectKat) selectKat.value = kategoriItem;
                    }

                    let itemHtml = "";
                    if (item.status === "Standby") {
                        let urut = kategoriItem === "AV" ? urutAV++ : urutHA++;
                        itemHtml = `<li><b>${urut}. ${item.nama}</b> <span class="badge-status-item badge-standby">Standby</span></li>`;
                    } else if (item.status === "Melayani") {
                        itemHtml = `<li><b>${item.nama}</b> <span class="badge-status-item badge-melayani">Melayani</span></li>`;
                    } else if (item.status === "Dipanggil CS/GUDANG" || item.status === "Dipanggil CS") {
                        let urut = kategoriItem === "AV" ? urutAV++ : urutHA++;
                        itemHtml = `<li><b>${urut}. ${item.nama}</b> <span class="badge-status-item badge-cs">Dipanggil CS/GUDANG</span></li>`;
                    }

                    if (kategoriItem === "AV") listHtmlAV += itemHtml;
                    else listHtmlHA += itemHtml;
                });
            }

            if(!listHtmlHA) listHtmlHA = "<li><span style='color:#64748b; font-style:italic;'>Belum ada antrian HA</span></li>";
            if(!listHtmlAV) listHtmlAV = "<li><span style='color:#64748b; font-style:italic;'>Belum ada antrian AV</span></li>";

            let isLocked = false;
            let alasanLockSPV = "";
            if (akunSaya && masterSalesGlobal.length > 0) {
                const sayaObj = masterSalesGlobal.find(item => String(item.nama).trim().toLowerCase() === akunSaya.toLowerCase());
                if (sayaObj && String(sayaObj.statusLock).toUpperCase() === "LOCKED") {
                    isLocked = true;
                    alasanLockSPV = sayaObj.alasanLock ? sayaObj.alasanLock : "Tidak ada keterangan dari SPV.";
                }
            }

            const btnCustomer = document.getElementById('btn-utama-customer');
            const btnClosing = document.getElementById('btn-selesai-closing');
            const btnCS = document.getElementById('btn-utama-cs');
            const btnKeluar = document.getElementById('btn-keluar-istirahat');
            const selectKategori = document.getElementById('pilih-kategori');
            const lockBoxEl = document.getElementById('keterangan-lock-box');
            const teksAlasanEl = document.getElementById('teks-alasan-lock');

            if (isLocked) {
                if (lockBoxEl && teksAlasanEl) {
                    lockBoxEl.style.display = "block";
                    teksAlasanEl.innerText = `Alasan: "${alasanLockSPV}"`;
                }
                btnCustomer.style.display = "none"; btnClosing.style.display = "none";
                btnCS.style.display = "none"; btnKeluar.style.display = "none"; selectKategori.disabled = true;
            } else {
                if (lockBoxEl) lockBoxEl.style.display = "none";

                if (statusSayaGlobal === "Melayani") {
                    btnCustomer.style.display = "none"; btnClosing.style.display = "block";
                    btnClosing.disabled = false; btnCS.style.display = "none"; btnKeluar.style.display = "none"; selectKategori.disabled = true;
                } else if (statusSayaGlobal === "Standby") {
                    btnCustomer.style.display = "block"; btnClosing.style.display = "none";
                    let kategoriSaya = selectKategori.value;
                    let bisaAmbil = (kategoriSaya === "AV" && apakahSayaUrutanPertamaAV) || (kategoriSaya !== "AV" && apakahSayaUrutanPertamaHA);
                    btnCustomer.disabled = !bisaAmbil;
                    btnCustomer.className = bisaAmbil ? "btn-customer" : "btn-customer btn-disabled";

                    btnCS.style.display = "block"; btnCS.disabled = false;
                    btnKeluar.style.display = "block"; btnKeluar.disabled = false; selectKategori.disabled = true;
                } else if (statusSayaGlobal === "Dipanggil CS/GUDANG" || statusSayaGlobal === "Dipanggil CS") {
                    btnCustomer.style.display = "none"; btnClosing.style.display = "none";
                    btnCS.style.display = "block"; btnCS.innerText = "SELESAI CS/GUDANG (KEMBALI ANTRI)";
                    btnCS.className = "btn-teal"; btnKeluar.style.display = "none"; selectKategori.disabled = true;
                } else { 
                    btnCustomer.style.display = "none"; btnClosing.style.display = "none";
                    btnCS.style.display = "none"; btnKeluar.style.display = "none"; selectKategori.disabled = false;
                }
            }

            document.getElementById('nama-aktif-ha').innerText = namaHANow;
            document.getElementById('nama-aktif-av').innerText = namaAVNow;
            document.getElementById('item-antrian-list-ha').innerHTML = listHtmlHA;
            document.getElementById('item-antrian-list-av').innerHTML = listHtmlAV;
        }

        function muatDataAntrian(paksaTarik = false) {
            if (sedangProsesAksi && !paksaTarik) return;
            Promise.all([
                fetch(`${SCRIPT_URL}?aksi=getAntrian&t=${Date.now()}`).then(r => r.json()).catch(() => null),
                fetch(`${SCRIPT_URL}?aksi=getMasterSales&t=${Date.now()}`).then(r => r.json()).catch(() => null)
            ]).then(([resAntrian, resSales]) => {
                if (resAntrian && resAntrian.status === "sukses") {
                    localStorage.setItem('ufo_antrian_cache', JSON.stringify(resAntrian));
                    renderUIRental(resAntrian.data, resAntrian.statusAntrian, resAntrian.waktuStandbyHA, resAntrian.waktuStandbyAV, resAntrian.pengumumanSPV);
                }
                if (resSales && resSales.status === "sukses" && resSales.data) {
                    masterSalesGlobal = resSales.data;
                    localStorage.setItem('ufo_master_sales_cache', JSON.stringify(resSales.data));
                }
            });
        }

        function aksiUtamaCustomer() {
            const namaSales = getAkunAktif();
            if(!namaSales || statusSayaGlobal !== "Standby") return;
            tampilkanModalKonfirmasi("Konfirmasi", "Sudah membawa customer?", function() {
                sedangProsesAksi = true;
                fetch(`${SCRIPT_URL}?aksi=ambilAntrian&namaSales=${encodeURIComponent(namaSales)}&t=${Date.now()}`)
                .then(() => { sedangProsesAksi = false; muatDataAntrian(true); });
            });
        }

        function aksiSelesaiClosing() {
            const namaSales = getAkunAktif();
            if(!namaSales) return;
            tampilkanModalKonfirmasi("Konfirmasi Selesai", "Selesai melayani customer? Anda akan dikeluarkan dari antrian.", function() {
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
                sedangProsesAksi = true;
                fetch(`${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}&t=${Date.now()}`)
                .then(() => { sedangProsesAksi = false; muatDataAntrian(true); });
            });
        }

        function aksiToggleCS() {
            const namaSales = getAkunAktif();
            if(!namaSales) return;
            if (statusSayaGlobal === "Standby") {
                tampilkanModalKonfirmasi("Status Dipanggil CS/GUDANG", "Dipanggil oleh CS/GUDANG? Posisi antrian Anda akan dikunci.", function() {
                    sedangProsesAksi = true;
                    fetch(`${SCRIPT_URL}?aksi=panggilCS&namaSales=${encodeURIComponent(namaSales)}&t=${Date.now()}`)
                    .then(() => { sedangProsesAksi = false; muatDataAntrian(true); });
                });
            } else if (statusSayaGlobal === "Dipanggil CS/GUDANG" || statusSayaGlobal === "Dipanggil CS") {
                tampilkanModalKonfirmasi("Selesai Urusan CS/GUDANG", "Urusan CS/GUDANG sudah selesai? Kembali aktif di antrian.", function() {
                    sedangProsesAksi = true;
                    fetch(`${SCRIPT_URL}?aksi=selesaiCS&namaSales=${encodeURIComponent(namaSales)}&t=${Date.now()}`)
                    .then(() => { sedangProsesAksi = false; muatDataAntrian(true); });
                });
            }
        }

        function bukaModalKeluarIstirahat() {
            const namaSales = getAkunAktif();
            if (!namaSales) return;
            tampilkanModalKonfirmasi("Keluar Antrian", "Apakah Anda yakin ingin keluar dari antrian untuk istirahat / ada keperluan?", function() {
                sedangProsesAksi = true;
                fetch(`${SCRIPT_URL}?aksi=selesaiMelayani&namaSales=${encodeURIComponent(namaSales)}&t=${Date.now()}`)
                .then(() => { sedangProsesAksi = false; muatDataAntrian(true); });
            });
        }

        function tampilkanModal(judul, desc) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-customer" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, desc, callbackYa) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-cancel" onclick="tutupModal()">Batal</button>
                <button type="button" class="btn-customer" id="btn-modal-ya">Ya</button>
            `;
            document.getElementById('custom-modal').classList.add('active');
            document.getElementById('btn-modal-ya').onclick = function() { tutupModal(); callbackYa(); };
        }
        function tutupModal() { document.getElementById('custom-modal').classList.remove('active'); }
    </script>
</body>
</html>
