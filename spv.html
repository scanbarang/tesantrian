<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SPV - Antrian Walk-In Promotor</title>
    <!-- Menghilangkan Peringatan Favicon 404 -->
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #059669;
            --customer-blue: #2563eb;
            --closing-red: #dc2626;
            --purple-cs: #7c3aed;
            --teal-cs: #0d9488;
            --amber-rest: #d97706;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
        }

        *, body, button, select, input {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px; padding: 24px;
            border: 2px solid var(--border);
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .gradient-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 18px; padding: 22px; color: white; margin-bottom: 20px;
            box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.3);
        }
        .gradient-header h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .gradient-header p { margin: 6px 0 0 0; opacity: 0.9; font-size: 13px; font-weight: 700; }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }

        select, input[type="text"], textarea { 
            width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--border);
            background: #ffffff; font-size: 15px; font-weight: 600; color: var(--text-main); outline: none;
            transition: all 0.2s ease;
        }
        select:focus, input[type="text"]:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        button { 
            width: 100%; padding: 14px 12px; border-radius: 14px; 
            font-size: 13px; font-weight: 800; cursor: pointer; border: none;
            text-transform: uppercase; transition: all 0.2s ease;
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
            letter-spacing: 0.3px;
        }
        button:active { transform: scale(0.98); }

        .btn-success { background: var(--success); color: white; }
        .btn-customer { background: var(--customer-blue); color: white; }
        .btn-closing { background: var(--closing-red); color: white; }
        .btn-amber { background: var(--amber-rest); color: white; }
        .btn-action { padding: 6px 10px; font-size: 11px; border-radius: 8px; width: auto; }

        .table-responsive {
            width: 100%; overflow-x: auto; margin-top: 10px; border-radius: 12px; border: 2px solid var(--border);
        }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 11px; }
        tr:last-child td { border-bottom: none; }

        .badge-status { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; display: inline-block; }
        .badge-penalti { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .badge-normal { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 380px; padding: 24px; border-radius: 20px; text-align: center; border: 2px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; font-weight: 600; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Dashboard SPV</h2>
            <p>UFO Kebonsari</p>
        </div>

        <!-- 1. KONTROL BUKA / TUTUP SISTEM -->
        <div style="display: flex; gap: 10px; margin-bottom: 12px;">
            <button type="button" class="btn-success" onclick="aturStatusSistem('BUKA')">Buka Sistem</button>
            <button type="button" class="btn-closing" onclick="aturStatusSistem('TUTUP')">Tutup Sistem</button>
        </div>

        <!-- 2. RESET ANTRIAN -->
        <button type="button" class="btn-amber" onclick="resetAntrian()" style="margin-bottom: 20px;">Reset Seluruh Antrian Hari Ini</button>

        <!-- 3. PAKSA UBAH STATUS PROMOTOR -->
        <div class="input-group">
            <label>Paksa Ubah Status Promotor</label>
            <select id="pilih-sales-target" style="margin-bottom: 8px;">
                <option value="">-- Pilih Promotor --</option>
            </select>
            <select id="pilih-status-target" style="margin-bottom: 8px;">
                <option value="Standby">Standby</option>
                <option value="Melayani">Melayani</option>
                <option value="Selesai">Keluarkan (Selesai)</option>
            </select>
            <button type="button" class="btn-customer" onclick="paksaUbahStatus()">Terapkan Perubahan</button>
        </div>

        <!-- 4. KIRIM PENGUMUMAN SPV -->
        <div class="input-group" style="margin-top: 20px;">
            <label>Kirim Pengumuman Wajib</label>
            <textarea id="input-pengumuman-spv" placeholder="Tulis pengumuman penting untuk promotor..."></textarea>
            <button type="button" class="btn-customer" style="margin-top: 8px;" onclick="kirimPengumuman()">Kirim Pengumuman</button>
        </div>

        <!-- 5. TABEL PEMANTAUAN SANKSI PENALTI & TOMBOL LEPAS PENALTI -->
        <div class="input-group" style="margin-top: 24px;">
            <label style="display: flex; justify-content: space-between; align-items: center;">
                <span>Pemantauan Sanksi Promotor</span>
                <button type="button" class="btn-action btn-customer" onclick="muatDataDashboard()">Refresh</button>
            </label>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Status Sanksi</th>
                            <th>Keterangan</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabel-penalti-body">
                        <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">Isi pesan...</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-customer" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLx0UculzvBRESbJY2DYf3BLf9sNz5uLU7VEZ8xyvqm2bFfKxa9Emf9LoVYxePDwpx/exec";

        window.onload = function() {
            muatDataDashboard();
            setInterval(muatDataDashboard, 5000);
        };

        function muatDataDashboard() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    renderDropdownSales(res.data);
                    renderTabelPenalti(res.data);
                }
            }).catch(() => {});
        }

        function renderDropdownSales(dataSales) {
            let html = '<option value="">-- Pilih Promotor --</option>';
            dataSales.forEach(item => {
                const nama = typeof item === 'object' ? item.nama : item;
                html += `<option value="${nama}">${nama}</option>`;
            });
            const selectEl = document.getElementById('pilih-sales-target');
            if (selectEl) selectEl.innerHTML = html;
        }

        function renderTabelPenalti(dataSales) {
            let html = "";
            dataSales.forEach(item => {
                const nama = typeof item === 'object' ? item.nama : item;
                const sanksiMenit = item.sanksiMenit ? parseInt(item.sanksiMenit) : 0;
                const pesanSanksi = item.pesanSanksi || "-";

                let badgeHtml = `<span class="badge-status badge-normal">Normal</span>`;
                let aksiHtml = `-`;

                if (sanksiMenit > 0) {
                    badgeHtml = `<span class="badge-status badge-penalti">Penalti (${sanksiMenit}m)</span>`;
                    aksiHtml = `<button type="button" class="btn-action btn-closing" onclick="lepasPenalti('${nama}')">Lepas</button>`;
                }

                html += `
                    <tr>
                        <td><b>${nama}</b></td>
                        <td>${badgeHtml}</td>
                        <td style="font-size: 11px; color: var(--text-muted);">${sanksiMenit > 0 ? pesanSanksi : 'Aman'}</td>
                        <td>${aksiHtml}</td>
                    </tr>
                `;
            });

            document.getElementById('tabel-penalti-body').innerHTML = html || `<tr><td colspan="4" style="text-align: center;">Tidak ada data promotor</td></tr>`;
        }

        function lepasPenalti(namaSales) {
            tampilkanModalKonfirmasi("Lepas Sanksi Penalti", `Yakin ingin melepaskan sanksi penalti untuk promotor (${namaSales})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=lepasPenalti&namaSales=${encodeURIComponent(namaSales)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Sanksi penalti untuk ${namaSales} telah dilepaskan.`);
                    muatDataDashboard();
                }).catch(() => {
                    tampilkanModal("Gagal", "Terjadi kesalahan jaringan.");
                });
            });
        }

        function aturStatusSistem(statusBukaTutup) {
            tampilkanModalKonfirmasi("Konfirmasi Sistem", `Ubah status sistem antrian menjadi ${statusBukaTutup}?`, function() {
                fetch(`${SCRIPT_URL}?aksi=aturStatusSistem&status=${statusBukaTutup}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Sistem antrian berhasil diatur ke: ${statusBukaTutup}`);
                });
            });
        }

        function resetAntrian() {
            tampilkanModalKonfirmasi("Reset Antrian", "Yakin ingin mereset seluruh antrian hari ini?", function() {
                fetch(`${SCRIPT_URL}?aksi=resetAntrian`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", "Semua antrian berhasil direset.");
                });
            });
        }

        function paksaUbahStatus() {
            const namaSales = document.getElementById('pilih-sales-target').value;
            const statusTarget = document.getElementById('pilih-status-target').value;
            if(!namaSales) return tampilkanModal("Perhatian", "Silakan pilih promotor terlebih dahulu!");

            tampilkanModalKonfirmasi("Paksa Ubah Status", `Ubah status promotor (${namaSales}) menjadi (${statusTarget})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=paksaUbahStatus&namaSales=${encodeURIComponent(namaSales)}&statusTarget=${encodeURIComponent(statusTarget)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Status ${namaSales} berhasil diubah menjadi ${statusTarget}.`);
                    muatDataDashboard();
                });
            });
        }

        function kirimPengumuman() {
            const teks = document.getElementById('input-pengumuman-spv').value.trim();
            if(!teks) return tampilkanModal("Perhatian", "Teks pengumuman tidak boleh kosong!");

            fetch(`${SCRIPT_URL}?aksi=kirimPengumuman&teks=${encodeURIComponent(teks)}`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                tampilkanModal("Berhasil", "Pengumuman wajib berhasil dikirim ke seluruh layar promotor.");
                document.getElementById('input-pengumuman-spv').value = "";
            });
        }

        function tampilkanModal(judul, desc) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-customer" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, desc, callbackYa) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" style="background:#e2e8f0; color:#0f172a;" onclick="tutupModal()">Batal</button>
                <button type="button" class="btn-customer" id="btn-modal-ya">Ya</button>
            `;
            document.getElementById('custom-modal').classList.add('active');
            document.getElementById('btn-modal-ya').onclick = function() { tutupModal(); callbackYa(); };
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
