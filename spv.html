<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SPV - Antrian Walk-In UFO Kebonsari</title>
    <!-- Menghilangkan Peringatan Favicon 404 -->
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
        }

        *, body, button, select, input {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding: 16px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 600px;
            background: var(--card-bg);
            border-radius: 24px; padding: 24px;
            border: 2px solid var(--border);
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1);
        }

        /* HEADER GRADASI SPV */
        .gradient-header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 18px; padding: 22px; color: white; margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.3);
        }
        .gradient-header h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .gradient-header p { margin: 6px 0 0 0; opacity: 0.9; font-size: 13px; font-weight: 700; }

        .control-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px;
        }

        .input-group { margin-bottom: 16px; text-align: left; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }

        select, textarea { 
            width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--border);
            background: #ffffff; font-size: 15px; font-weight: 600; color: var(--text-main); outline: none;
            transition: all 0.2s ease;
        }
        select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }

        button { 
            width: 100%; padding: 14px 12px; border-radius: 14px; 
            font-size: 13px; font-weight: 800; cursor: pointer; border: none;
            text-transform: uppercase; transition: all 0.2s ease;
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
            letter-spacing: 0.3px;
        }
        button:active { transform: scale(0.98); }

        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-action { padding: 6px 10px; font-size: 11px; border-radius: 8px; width: auto; }

        .section-title {
            font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;
            margin: 20px 0 10px 0; letter-spacing: 0.5px; text-align: left;
            display: flex; justify-content: space-between; align-items: center;
        }

        .table-responsive {
            width: 100%; overflow-x: auto; margin-bottom: 16px; border-radius: 12px; border: 2px solid var(--border);
        }

        table {
            width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;
        }

        th, td {
            padding: 10px 12px; border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 11px;
        }

        tr:last-child td { border-bottom: none; }

        .badge-status {
            padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; display: inline-block;
        }
        .badge-penalti { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .badge-normal { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.75); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 380px; padding: 24px; border-radius: 20px; text-align: center; border: 2px solid var(--border); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); }
        .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; font-weight: 600; line-height: 1.4; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 13px; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Dashboard SPV</h2>
            <p>Kontrol Sistem & Pemantauan Sanksi Promotor UFO Kebonsari</p>
        </div>

        <!-- 1. KONTROL BUKA / TUTUP SISTEM & RESET -->
        <div class="control-grid">
            <button type="button" class="btn-success" onclick="ubahStatusSistem('BUKA')">Buka Sistem</button>
            <button type="button" class="btn-danger" onclick="ubahStatusSistem('TUTUP')">Tutup Sistem</button>
        </div>
        <button type="button" class="btn-warning" onclick="resetAntrianHariIni()" style="margin-bottom: 20px;">Reset Seluruh Antrian Hari Ini</button>

        <!-- 2. KONTROL PAKSA GANTI STATUS PROMOTOR -->
        <div class="input-group">
            <label>Paksa Ubah Status Promotor (Pilih Nama & Status)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px;">
                <select id="select-sales-target">
                    <option value="">-- Pilih Promotor --</option>
                </select>
                <select id="select-status-target">
                    <option value="Standby">Standby</option>
                    <option value="Melayani">Melayani</option>
                    <option value="Selesai">Keluarkan (Selesai)</option>
                </select>
            </div>
            <button type="button" class="btn-primary" onclick="paksaUbahStatus()">Terapkan Perubahan Status</button>
        </div>

        <!-- 3. KIRIM PENGUMUMAN WAJIB -->
        <div class="input-group">
            <label>Kirim Pengumuman Wajib ke Layar Promotor</label>
            <textarea id="input-pengumuman" placeholder="Tulis instruksi atau pengumuman penting di sini..."></textarea>
            <button type="button" class="btn-success" style="margin-top: 8px;" onclick="kirimPengumuman()">Kirim Pengumuman</button>
        </div>

        <!-- 4. TABEL PEMANTAUAN PROMOTOR & SANKSI PENALTI -->
        <div class="section-title">
            <span>Pemantauan Sanksi & Promotor</span>
            <button type="button" class="btn-action btn-primary" onclick="muatDataDashboard()">Refresh</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nama Promotor</th>
                        <th>Status Sanksi</th>
                        <th>Keterangan Sanksi</th>
                        <th>Aksi SPV</th>
                    </tr>
                </thead>
                <tbody id="tabel-promotor-body">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted);">Memuat data promotor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">Isi pesan...</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-success" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLx0UculzvBRESbJY2DYf3BLf9sNz5uLU7VEZ8xyvqm2bFfKxa9Emf9LoVYxePDwpx/exec";

        window.onload = function() {
            muatDataDashboard();
            setInterval(muatDataDashboard, 5000);
        };

        function muatDataDashboard() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    renderDropdownSales(res.data);
                    renderTabelPromotor(res.data);
                }
            }).catch(() => {});
        }

        function renderDropdownSales(dataSales) {
            let html = '<option value="">-- Pilih Promotor --</option>';
            dataSales.forEach(item => {
                const nama = typeof item === 'object' ? item.nama : item;
                html += `<option value="${nama}">${nama}</option>`;
            });
            const selectEl = document.getElementById('select-sales-target');
            if (selectEl) selectEl.innerHTML = html;
        }

        function renderTabelPromotor(dataSales) {
            let html = "";
            dataSales.forEach(item => {
                const nama = typeof item === 'object' ? item.nama : item;
                const sanksiMenit = item.sanksiMenit ? parseInt(item.sanksiMenit) : 0;
                const pesanSanksi = item.pesanSanksi || "-";

                let badgeHtml = `<span class="badge-status badge-normal">Normal</span>`;
                let aksiHtml = `-`;

                if (sanksiMenit > 0) {
                    badgeHtml = `<span class="badge-status badge-penalti">Penalti (${sanksiMenit}m)</span>`;
                    aksiHtml = `<button type="button" class="btn-action btn-danger" onclick="lepasPenalti('${nama}')">Lepas</button>`;
                }

                html += `
                    <tr>
                        <td><b>${nama}</b></td>
                        <td>${badgeHtml}</td>
                        <td style="font-size: 11px; color: var(--text-muted);">${sanksiMenit > 0 ? pesanSanksi : 'Aman'}</td>
                        <td>${aksiHtml}</td>
                    </tr>
                `;
            });

            document.getElementById('tabel-promotor-body').innerHTML = html || `<tr><td colspan="4" style="text-align: center;">Tidak ada data promotor</td></tr>`;
        }

        function lepasPenalti(namaSales) {
            tampilkanModalKonfirmasi("Lepas Sanksi Penalti", `Yakin ingin melepaskan sanksi penalti untuk promotor (${namaSales})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=lepasPenalti&namaSales=${encodeURIComponent(namaSales)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Sanksi penalti untuk ${namaSales} telah dilepaskan.`);
                    muatDataDashboard();
                }).catch(() => {
                    tampilkanModal("Gagal", "Terjadi kesalahan jaringan.");
                });
            });
        }

        function ubahStatusSistem(statusBukaTutup) {
            tampilkanModalKonfirmasi("Konfirmasi Sistem", `Ubah status sistem antrian menjadi ${statusBukaTutup}?`, function() {
                fetch(`${SCRIPT_URL}?aksi=aturStatusSistem&status=${statusBukaTutup}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Sistem antrian berhasil diatur ke: ${statusBukaTutup}`);
                });
            });
        }

        function resetAntrianHariIni() {
            tampilkanModalKonfirmasi("Reset Antrian", "Yakin ingin mereset seluruh antrian hari ini?", function() {
                fetch(`${SCRIPT_URL}?aksi=resetAntrian`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", "Semua antrian berhasil direset.");
                });
            });
        }

        function paksaUbahStatus() {
            const namaSales = document.getElementById('select-sales-target').value;
            const statusTarget = document.getElementById('select-status-target').value;
            if(!namaSales) return tampilkanModal("Perhatian", "Silakan pilih promotor terlebih dahulu!");

            tampilkanModalKonfirmasi("Paksa Ubah Status", `Ubah status promotor (${namaSales}) menjadi (${statusTarget})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=paksaUbahStatus&namaSales=${encodeURIComponent(namaSales)}&statusTarget=${encodeURIComponent(statusTarget)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Status ${namaSales} berhasil diubah menjadi ${statusTarget}.`);
                    muatDataDashboard();
                });
            });
        }

        function kirimPengumuman() {
            const teks = document.getElementById('input-pengumuman').value.trim();
            if(!teks) return tampilkanModal("Perhatian", "Teks pengumuman tidak boleh kosong!");

            fetch(`${SCRIPT_URL}?aksi=kirimPengumuman&teks=${encodeURIComponent(teks)}`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                tampilkanModal("Berhasil", "Pengumuman wajib berhasil dikirim ke seluruh layar promotor.");
                document.getElementById('input-pengumuman').value = "";
            });
        }

        function tampilkanModal(judul, desc) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-success" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, desc, callbackYa) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-danger" onclick="tutupModal()" style="background:#e2e8f0; color:#0f172a;">Batal</button>
                <button type="button" class="btn-success" id="btn-modal-ya">Ya</button>
            `;
            document.getElementById('custom-modal').classList.add('active');
            document.getElementById('btn-modal-ya').onclick = function() { tutupModal(); callbackYa(); };
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
