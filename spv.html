<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard SPV - Antrian Walk-In UFO Kebonsari</title>
    <link rel="shortcut icon" href="#">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #059669;
            --warning: #d97706;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border: #cbd5e1;
        }

        *, body, button, select, input {
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            box-sizing: border-box;
        }

        body { 
            background: var(--bg-color); 
            color: var(--text-main);
            margin: 0; padding: 20px;
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 800px;
            background: var(--card-bg);
            border-radius: 24px; padding: 24px;
            border: 2px solid var(--border);
            box-shadow: 0 15px 35px -5px rgba(0,0,0,0.1);
        }

        .gradient-header {
            background: linear-gradient(135deg, #dc2626 0%, #1e293b 100%);
            border-radius: 18px; padding: 22px; color: white; margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 20px -4px rgba(220, 38, 38, 0.3);
        }
        .gradient-header h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        .gradient-header p { margin: 6px 0 0 0; opacity: 0.9; font-size: 14px; font-weight: 700; }

        .control-panel {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;
        }

        button { 
            width: 100%; padding: 14px; border-radius: 14px; 
            font-size: 13px; font-weight: 800; cursor: pointer; border: none;
            text-transform: uppercase; transition: all 0.2s ease;
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
        }
        button:active { transform: scale(0.98); }

        .btn-open { background: var(--success); color: white; }
        .btn-close { background: var(--danger); color: white; }
        .btn-reset { background: var(--warning); color: white; grid-column: span 2; }
        .btn-action { padding: 8px 12px; font-size: 11px; border-radius: 8px; width: auto; }

        .section-title {
            font-size: 14px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;
            margin-bottom: 12px; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center;
        }

        .table-responsive {
            width: 100%; overflow-x: auto; margin-bottom: 24px; border-radius: 12px; border: 2px solid var(--border);
        }

        table {
            width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;
        }

        th, td {
            padding: 12px 16px; border-bottom: 1px solid var(--border);
        }

        th {
            background: #f8fafc; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 11px;
        }

        tr:last-child td { border-bottom: none; }

        .badge-status {
            padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; display: inline-block;
        }
        .badge-penalti { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .badge-normal { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        textarea {
            width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border);
            font-size: 14px; font-weight: 600; outline: none; resize: vertical; min-height: 80px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 11, 20, 0.7); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.2s; padding: 16px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-box { background: white; width: 100%; max-width: 380px; padding: 24px; border-radius: 20px; text-align: center; border: 2px solid var(--border); }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
        .modal-desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; font-weight: 600; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button { flex: 1; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="gradient-header">
            <h2>Dashboard SPV</h2>
            <p>Kontrol & Pemantauan Sanksi Promotor UFO Kebonsari</p>
        </div>

        <!-- KONTROL SISTEM UTAMA -->
        <div class="control-panel">
            <button type="button" class="btn-open" onclick="ubahStatusSistem('BUKA')">Buka Sistem Antrian</button>
            <button type="button" class="btn-close" onclick="ubahStatusSistem('TUTUP')">Tutup Sistem Antrian</button>
            <button type="button" class="btn-reset" onclick="resetAntrianHariIni()">Reset Seluruh Antrian Hari Ini</button>
        </div>

        <!-- PENGUMUMAN SPV -->
        <div class="input-group">
            <label>Kirim Pengumuman Wajib ke Promotor</label>
            <textarea id="input-pengumuman" placeholder="Tulis pengumuman penting di sini..."></textarea>
            <button type="button" class="btn-open" style="margin-top: 8px;" onclick="kirimPengumuman()">Kirim Pengumuman</button>
        </div>

        <!-- TABEL PEMANTAUAN PROMOTOR & SANKSI PENALTI -->
        <div class="section-title">
            <span>Daftar Promotor & Pemantauan Sanksi</span>
            <button type="button" class="btn-action btn-open" onclick="muatDataDashboard()">Refresh Data</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nama Promotor</th>
                        <th>Status Sanksi</th>
                        <th>Keterangan Sanksi</th>
                        <th>Aksi SPV</th>
                    </tr>
                </thead>
                <tbody id="tabel-promotor-body">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted);">Memuat data promotor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL POPUP -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div id="modal-title" class="modal-title">Pemberitahuan</div>
            <div id="modal-desc" class="modal-desc">Isi pesan...</div>
            <div id="modal-actions" class="modal-actions">
                <button type="button" class="btn-open" onclick="tutupModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLx0UculzvBRESbJY2DYf3BLf9sNz5uLU7VEZ8xyvqm2bFfKxa9Emf9LoVYxePDwpx/exec";

        window.onload = function() {
            muatDataDashboard();
            setInterval(muatDataDashboard, 5000);
        };

        function muatDataDashboard() {
            fetch(`${SCRIPT_URL}?aksi=getMasterSales`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                if(res.status === "sukses" && res.data) {
                    renderTabelPromotor(res.data);
                }
            }).catch(() => {});
        }

        function renderTabelPromotor(dataSales) {
            let html = "";
            dataSales.forEach(item => {
                const nama = typeof item === 'object' ? item.nama : item;
                const sanksiMenit = item.sanksiMenit ? parseInt(item.sanksiMenit) : 0;
                const pesanSanksi = item.pesanSanksi || "-";

                let badgeHtml = `<span class="badge-status badge-normal">Normal</span>`;
                let aksiHtml = `-`;

                if (sanksiMenit > 0) {
                    badgeHtml = `<span class="badge-status badge-penalti">Terkena Penalti (${sanksiMenit}m)</span>`;
                    aksiHtml = `<button type="button" class="btn-action btn-close" onclick="lepasPenalti('${nama}')">Lepas Penalti</button>`;
                }

                html += `
                    <tr>
                        <td><b>${nama}</b></td>
                        <td>${badgeHtml}</td>
                        <td style="font-size: 12px; color: var(--text-muted);">${sanksiMenit > 0 ? pesanSanksi : 'Tidak ada sanksi'}</td>
                        <td>${aksiHtml}</td>
                    </tr>
                `;
            });

            document.getElementById('tabel-promotor-body').innerHTML = html || `<tr><td colspan="4" style="text-align: center;">Tidak ada data promotor</td></tr>`;
        }

        function lepasPenalti(namaSales) {
            tampilkanModalKonfirmasi("Lepas Sanksi Penalti", `Yakin ingin melepaskan sanksi penalti untuk promotor (${namaSales})?`, function() {
                fetch(`${SCRIPT_URL}?aksi=lepasPenalti&namaSales=${encodeURIComponent(namaSales)}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Sanksi penalti untuk ${namaSales} telah dilepaskan.`);
                    muatDataDashboard();
                }).catch(() => {
                    tampilkanModal("Gagal", "Terjadi kesalahan jaringan.");
                });
            });
        }

        function ubahStatusSistem(statusBukaTutup) {
            tampilkanModalKonfirmasi("Konfirmasi Sistem", `Ubah status sistem antrian menjadi ${statusBukaTutup}?`, function() {
                fetch(`${SCRIPT_URL}?aksi=aturStatusSistem&status=${statusBukaTutup}`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", `Sistem antrian berhasil diatur ke: ${statusBukaTutup}`);
                });
            });
        }

        function resetAntrianHariIni() {
            tampilkanModalKonfirmasi("Reset Antrian", "Yakin ingin mereset seluruh antrian hari ini?", function() {
                fetch(`${SCRIPT_URL}?aksi=resetAntrian`, { method: 'GET', redirect: 'follow' })
                .then(res => res.json())
                .then(res => {
                    tampilkanModal("Berhasil", "Semua antrian berhasil direset.");
                });
            });
        }

        function kirimPengumuman() {
            const teks = document.getElementById('input-pengumuman').value.trim();
            if(!teks) return tampilkanModal("Perhatian", "Teks pengumuman tidak boleh kosong!");

            fetch(`${SCRIPT_URL}?aksi=kirimPengumuman&teks=${encodeURIComponent(teks)}`, { method: 'GET', redirect: 'follow' })
            .then(res => res.json())
            .then(res => {
                tampilkanModal("Berhasil", "Pengumuman wajib berhasil dikirim ke seluruh layar promotor.");
                document.getElementById('input-pengumuman').value = "";
            });
        }

        function tampilkanModal(judul, desc) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `<button type="button" class="btn-open" onclick="tutupModal()">OK</button>`;
            document.getElementById('custom-modal').classList.add('active');
        }

        function tampilkanModalKonfirmasi(judul, desc, callbackYa) {
            document.getElementById('modal-title').innerText = judul;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-actions').innerHTML = `
                <button type="button" class="btn-close" onclick="tutupModal()" style="background:#e2e8f0; color:#0f172a;">Batal</button>
                <button type="button" class="btn-open" id="btn-modal-ya">Ya</button>
            `;
            document.getElementById('custom-modal').classList.add('active');
            document.getElementById('btn-modal-ya').onclick = function() { tutupModal(); callbackYa(); };
        }

        function tutupModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
    </script>
</body>
</html>
